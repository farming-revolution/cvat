name: Track identity regression
on:
  pull_request:
    paths:
      - 'cvat-core/**'
      - 'tests/unit/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/track-identity.yml'
  push:
    branches: ['farming/**']
  workflow_dispatch:
jobs:
  track-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
        env:
          DISABLE_HUSKY: '1'
      - run: yarn test:track-identity
